<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Availability - CLSMS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Main menu"></nav>

  <main>
    <h1>Room Availability</h1>
    <noscript><p class="alert alert-error">This page needs JavaScript turned on.</p></noscript>
    <div id="messages" aria-live="polite"></div>

    <section class="card" aria-labelledby="formTitle">
      <h2 id="formTitle">Find free rooms</h2>
      <form id="availabilityForm" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="day">Day</label>
            <select id="day"></select>
          </div>
          <div class="field">
            <label for="start">Start time</label>
            <input id="start" type="time">
          </div>
          <div class="field">
            <label for="end">End time</label>
            <input id="end" type="time">
          </div>
          <div class="field">
            <label for="minCapacity">Minimum capacity (optional)</label>
            <input id="minCapacity" type="number" min="1" step="1">
          </div>
          <div class="field">
            <label for="type">Room type (optional)</label>
            <select id="type">
              <option value="">Any type</option>
              <option value="CLASSROOM">Classroom</option>
              <option value="LABORATORY">Laboratory</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn" id="searchBtn">Find rooms</button>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="resultsTitle">
      <h2 id="resultsTitle">Free rooms</h2>
      <p class="empty" id="resultsNote">Choose a day and time, then press "Find rooms".</p>
      <div class="table-wrap" id="resultsWrap" hidden>
        <table>
          <thead>
            <tr><th>ID</th><th>Name</th><th>Type</th><th>Location</th><th>Capacity</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="api.js"></script>
<script src="ui.js"></script>
<script src="availability.js"></script>
</body>
</html>
