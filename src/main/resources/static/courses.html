<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courses - CLSMS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Main menu"></nav>

  <main>
    <h1>Courses</h1>
    <noscript><p class="alert alert-error">This page needs JavaScript turned on.</p></noscript>
    <div id="messages" aria-live="polite"></div>

    <section class="card" aria-labelledby="formTitle">
      <h2 id="formTitle">Add course</h2>
      <form id="courseForm" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="courseCode">Course code</label>
            <input id="courseCode" placeholder="e.g. CS301">
          </div>
          <div class="field">
            <label for="title">Title</label>
            <input id="title">
          </div>
          <div class="field">
            <label for="enrollment">Expected students</label>
            <input id="enrollment" type="number" step="1">
          </div>
          <div class="field">
            <label for="requiredType">Required room type</label>
            <select id="requiredType">
              <option value="">Any type</option>
              <option value="CLASSROOM">Classroom</option>
              <option value="LABORATORY">Laboratory</option>
            </select>
          </div>
          <div class="field">
            <label for="department">Department (optional)</label>
            <input id="department">
          </div>
          <div class="field">
            <label for="section">Section (optional)</label>
            <input id="section">
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn" id="saveBtn">Add course</button>
          <button type="button" class="btn secondary" id="stopEditBtn" hidden>Stop editing</button>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="listTitle">
      <h2 id="listTitle">All courses</h2>
      <div class="toolbar" style="margin-bottom:12px">
        <div class="field">
          <label for="search">Search</label>
          <input id="search" type="search" placeholder="Code, title or department">
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Code</th><th>Title</th><th>Students</th><th>Room type</th><th>Department</th><th>Section</th><th>Actions</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="api.js"></script>
<script src="ui.js"></script>
<script src="courses.js"></script>
</body>
</html>
